name: Desplegar en Render

# Se ejecuta cuando hay cambios en main (cada git push).
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Desplegar backend y frontend
    runs-on: ubuntu-latest

    steps:
      - name: Desplegar en Render
        env:
          # Token de la API de Render (Dashboard > Account Settings > API Keys)
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          # ID del servicio backend (Dashboard > escolar-backend > Settings)
          RENDER_BACKEND_SERVICE_ID: ${{ secrets.RENDER_BACKEND_SERVICE_ID }}
          # ID del servicio frontend (Dashboard > escolar-frontend > Settings)
          RENDER_FRONTEND_SERVICE_ID: ${{ secrets.RENDER_FRONTEND_SERVICE_ID }}
        run: |
          set -euo pipefail

          if [ -z "${RENDER_API_KEY}" ]; then
            echo "::error::Falta el secreto RENDER_API_KEY en Settings > Secrets"
            exit 1
          fi

          # Dispara un deploy manual de cada servicio.
          for SERVICE_ID in "${RENDER_BACKEND_SERVICE_ID}" "${RENDER_FRONTEND_SERVICE_ID}"; do
            if [ -z "${SERVICE_ID}" ]; then
              echo "::warning::Falta un RENDER_*_SERVICE_ID, se omite ese servicio"
              continue
            fi

            echo ">>> Desplegando servicio ${SERVICE_ID}"
            RESPONSE=$(curl -s -w '\n%{http_code}' -X POST \
              "https://api.render.com/v1/services/${SERVICE_ID}/deploys" \
              -H "Authorization: Bearer ${RENDER_API_KEY}" \
              -H "Content-Type: application/json" \
              -d '{"clearCache":"do_not_clear"}')

            CODE=$(echo "$RESPONSE" | tail -n1)
            BODY=$(echo "$RESPONSE" | sed '$d')

            if [ "$CODE" = "200" ] || [ "$CODE" = "201" ]; then
              echo "    Deploy solicitado correctamente (HTTP $CODE)"
              echo "$BODY" | head -c 400
              echo ""
            else
              echo "    ERROR al desplegar (HTTP $CODE):"
              echo "$BODY" | head -c 600
              echo ""
              exit 1
            fi
          done

          echo ""
          echo "Deploy disparado. Revisiona el estado en https://dashboard.render.com"
