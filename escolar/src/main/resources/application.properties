# ================= SERVIDOR =================
server.port=${PORT:8080}

# ================= BASE DE DATOS =================
# Todo configurable por variables de entorno para poder desplegar en la nube.
# Sin variables, usa el SQL Server local (desarrollo).
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost;instanceName=SQL2022;databaseName=SistemaGestionEscolar;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=${DB_DRIVER:com.microsoft.sqlserver.jdbc.SQLServerDriver}

# ================= JPA / HIBERNATE =================
# validate: solo verifica que las entidades coincidan con el esquema, NUNCA lo modifica.
# update/create: solo se usa en la nube, donde la base de datos se crea desde cero.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}

# SQL en consola (util para desarrollo; ponlo en false en produccion)
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${FORMAT_SQL:true}

# Necesario: los controladores devuelven entidades JPA con relaciones LAZY.
# Con open-in-view=true la sesion sigue abierta mientras Jackson las convierte a JSON.
spring.jpa.open-in-view=true

# ================= JWT =================
# Clave secreta para firmar los tokens (minimo 32 caracteres).
app.jwt.secret=${JWT_SECRET:EscolarJwtSecretKey2026CambiaEstaClaveEnProduccion123456}
# Minutos de validez del token (480 = 8 horas)
app.jwt.expiracion-minutos=${JWT_EXPIRACION_MINUTOS:480}

# ================= CORS =================
# Origenes permitidos para CORS (separados por coma).
# En la nube se define la variable de entorno CORS_ORIGENES.
app.cors.origenes=${CORS_ORIGENES:http://localhost:3000,http://localhost:5173,http://localhost:4200}

# ================= ARCHIVOS =================
# Carpeta donde se guardan los archivos subidos (materiales).
app.archivos.ruta=${ARCHIVOS_RUTA:./archivos}
